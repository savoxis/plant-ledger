services:
  plant-ledger:
    build: .
    container_name: plant-ledger
    restart: unless-stopped
    ports:
      - "3210:3000"
    volumes:
      - /mnt/user/appdata/plant-ledger:/data
    environment:
      - PORT=3000
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
