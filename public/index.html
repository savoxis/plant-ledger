<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plant Ledger</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#232019; --ink-soft:#5C564C;
    --forest:#1F3A2E; --forest-dark:#152A20; --sage:#7C9473; --sage-light:#E4EAE0;
    --soil:#6B4A2F; --soil-light:#F1E6DA; --gold:#C9A227; --line:#E6E1D6; --danger:#A63D2F;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;padding-bottom:100px;}
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  header{background:var(--forest);color:#F5F2E9;padding:22px 18px 18px;border-bottom:3px solid var(--gold);}
  header h1{margin:0;font-size:1.6rem;font-weight:500;}
  header p{margin:4px 0 0;color:#C9D6CB;font-size:0.85rem;}
  .search-bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 18px 10px;border-bottom:1px solid var(--line);}
  #search{width:100%;padding:12px 14px;font-size:1rem;border:2px solid var(--sage);border-radius:10px;background:var(--card);color:var(--ink);font-family:'Inter',sans-serif;}
  #search:focus{outline:none;border-color:var(--forest);}
  .search-count{font-size:0.78rem;color:var(--ink-soft);margin-top:6px;}
  .filters{display:flex;gap:8px;overflow-x:auto;padding:10px 18px 4px;-webkit-overflow-scrolling:touch;}
  .chip{flex:0 0 auto;padding:6px 14px;border-radius:999px;border:1px solid var(--sage);background:var(--card);color:var(--forest);font-size:0.82rem;font-weight:500;cursor:pointer;white-space:nowrap;}
  .chip.active{background:var(--forest);border-color:var(--forest);color:#fff;}
  .util-bar{display:flex;gap:10px;padding:8px 18px 4px;}
  .util-btn{flex:1;text-align:center;font-size:0.78rem;font-weight:600;color:var(--soil);background:var(--soil-light);padding:8px 10px;border-radius:8px;border:none;cursor:pointer;text-decoration:none;}
  main{padding:14px 18px;}
  .room-heading{display:flex;align-items:baseline;gap:8px;margin:22px 0 10px;padding-left:10px;border-left:4px solid var(--gold);}
  .room-heading h2{margin:0;font-size:1.15rem;font-weight:500;color:var(--forest-dark);}
  .room-heading span{font-size:0.8rem;color:var(--ink-soft);}
  .plant-card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;}
  .plant-head{padding:13px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px;}
  .plant-head-main{display:flex;align-items:center;gap:10px;}
  .thumb{width:42px;height:42px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid var(--line);}
  .plant-name{font-weight:600;font-size:0.98rem;line-height:1.3;}
  .badge-row{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;}
  .badge{font-size:0.7rem;padding:2px 8px;border-radius:999px;font-weight:600;}
  .badge.group-1{background:var(--sage-light);color:var(--forest-dark);}
  .badge.group-2{background:#EFE7D6;color:#7A6A2E;}
  .badge.group-3{background:#F3E4DC;color:var(--soil);}
  .badge.group-special{background:#E6DCF0;color:#5B3E7A;}
  .badge.status-tentative{background:#FBE9C6;color:#8A6416;}
  .badge.status-unconfirmed{background:#F5DADA;color:var(--danger);}
  .badge.propagating{background:#DCEEFB;color:#2A6690;}
  .move-badge{display:inline-flex;align-items:center;gap:4px;font-size:0.72rem;color:#2A6690;background:#DCEEFB;padding:2px 8px;border-radius:999px;font-weight:600;margin-top:5px;}
  .chevron{color:var(--ink-soft);font-size:0.9rem;transition:transform 0.15s ease;flex-shrink:0;}
  .plant-card.open .chevron{transform:rotate(90deg);}
  .plant-body{display:none;padding:0 14px 14px;border-top:1px solid var(--line);}
  .plant-card.open .plant-body{display:block;}
  .plant-photo{width:100%;max-height:280px;object-fit:cover;border-radius:10px;margin-top:10px;display:block;border:1px solid var(--line);}
  .photo-upload-row{margin-top:8px;display:flex;align-items:center;gap:8px;}
  .photo-upload-label{font-size:0.78rem;color:var(--forest);font-weight:600;cursor:pointer;background:var(--sage-light);padding:7px 12px;border-radius:8px;display:inline-block;position:relative;}
  .photo-upload-label input[type="file"]{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  .photo-remove{font-size:0.75rem;color:var(--danger);background:none;border:none;text-decoration:underline;cursor:pointer;}
  .notes{font-size:0.88rem;color:var(--ink-soft);margin:10px 0;line-height:1.5;}
  .location-field{margin:10px 0;}
  .location-field label{display:block;font-size:0.72rem;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
  .location-field input, .location-field select{width:100%;padding:8px 10px;border:1px solid var(--sage);border-radius:6px;font-family:'Inter',sans-serif;font-size:0.85rem;background:#F7FAF5;color:var(--ink);}
  .log-list{margin:10px 0;}
  .log-entry{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:0.83rem;}
  .log-entry:last-child{border-bottom:none;}
  .log-date{color:var(--ink-soft);white-space:nowrap;flex-shrink:0;}
  .log-type{font-weight:600;flex-shrink:0;}
  .log-type.Soil{color:var(--soil);} .log-type.Fertilizer{color:#5B7A3A;} .log-type.Repot{color:#2A6690;} .log-type.Other{color:var(--ink-soft);}
  .empty-log{font-size:0.82rem;color:var(--ink-soft);font-style:italic;}
  .btn{font-family:'Inter',sans-serif;font-weight:600;border:none;border-radius:8px;padding:9px 14px;font-size:0.85rem;cursor:pointer;}
  .btn-log{background:var(--soil-light);color:var(--soil);width:100%;margin-top:6px;}
  .btn-primary{background:var(--forest);color:#fff;}
  .btn-secondary{background:var(--sage-light);color:var(--forest-dark);}
  .btn-delete{background:none;color:var(--danger);font-size:0.78rem;padding:4px 0;text-decoration:underline;}
  .log-form{display:none;gap:8px;margin-top:10px;padding:10px;background:var(--bg);border-radius:8px;flex-direction:column;}
  .log-form.open{display:flex;}
  .log-form select, .log-form textarea{font-family:'Inter',sans-serif;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:0.85rem;background:#fff;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .empty-state .icon{font-size:2rem;margin-bottom:8px;}
  .fab{position:fixed;bottom:20px;right:20px;background:var(--gold);color:var(--forest-dark);border:none;border-radius:999px;padding:15px 22px;font-family:'Inter',sans-serif;font-weight:700;font-size:0.9rem;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;z-index:30;}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(21,42,32,0.55);z-index:50;align-items:flex-end;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:20px 18px 26px;max-height:88vh;overflow-y:auto;position:relative;}
  .modal h3{margin:0 0 14px;color:var(--forest-dark);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:0.78rem;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
  .field input, .field select, .field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-family:'Inter',sans-serif;font-size:0.9rem;}
  .field textarea{resize:vertical;min-height:60px;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions .btn{flex:1;}
  .close-x{position:absolute;top:14px;right:18px;background:none;border:none;font-size:1.3rem;color:var(--ink-soft);cursor:pointer;}
  .status-banner{padding:10px 18px;font-size:0.8rem;text-align:center;}
  .status-banner.error{background:#F5DADA;color:var(--danger);}
</style>
</head>
<body>

<header>
  <h1 class="serif">Zach's Plant Ledger</h1>
  <p id="total-count">Loading...</p>
</header>

<div id="status-banner"></div>

<div class="search-bar">
  <input type="text" id="search" placeholder="Search a plant name — check before you buy...">
  <div class="search-count" id="search-count"></div>
</div>

<div class="filters" id="filters"></div>

<div class="util-bar">
  <a class="util-btn" href="/api/export" download>&#8595; Export JSON snapshot</a>
</div>

<main id="plant-list"></main>

<button class="fab" id="add-fab">+ Add Plant</button>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="close-x" id="close-modal">&times;</button>
    <h3 class="serif">Add a Plant</h3>
    <div class="field"><label>Name</label><input type="text" id="new-name"></div>
    <div class="field">
      <label>Room</label>
      <select id="new-room">
        <option>Office</option><option>Living Room</option><option>Plant Room</option><option>Outside</option><option>Other</option>
      </select>
    </div>
    <div class="field">
      <label>Care group</label>
      <select id="new-group">
        <option value="group-1">Bright indirect + consistent moisture</option>
        <option value="group-2">Bright-medium, dry between</option>
        <option value="group-3">Bright light, dry-between (drought-tolerant)</option>
        <option value="special">Special care (own category)</option>
        <option value="unsure">Not sure yet</option>
      </select>
    </div>
    <div class="field">
      <label>ID status</label>
      <select id="new-status"><option value="confirmed">Confirmed</option><option value="tentative">Tentative</option><option value="unconfirmed">Unconfirmed</option></select>
    </div>
    <div class="field"><label>Notes (optional)</label><textarea id="new-notes"></textarea></div>
    <div class="field"><label><input type="checkbox" id="new-propagating" style="width:auto;margin-right:6px;">Currently propagating (rooting in water)</label></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancel-add">Cancel</button>
      <button class="btn btn-primary" id="save-new">Add Plant</button>
    </div>
  </div>
</div>

<script>
const API = '/api';
let plants = [];
let activeFilter = 'all';
let openCardId = null;
let openLogFormId = null;

const groupLabels = {'group-1':'Bright + moist','group-2':'Bright-medium, dry','group-3':'Bright, dry-tolerant','special':'Special care','unsure':'Unsorted'};
const zoneSuggestions = {'group-1':'Bright + Moist zone (Group 1 shelf)','group-2':'Bright-Medium, Dry zone (Group 2 shelf)','group-3':'Bright, Dry-Tolerant zone (Group 3 shelf)','special':'Its own dedicated spot — special care','unsure':''};
const knownRooms = ['Office','Living Room','Plant Room','Outside','Other'];

function showBanner(msg, isError){
  const el = document.getElementById('status-banner');
  el.className = 'status-banner' + (isError ? ' error' : '');
  el.textContent = msg;
  if(!isError) setTimeout(()=>{ el.textContent=''; el.className='status-banner'; }, 2500);
}

async function api(path, opts){
  try{
    const res = await fetch(API + path, opts);
    if(!res.ok){
      const body = await res.json().catch(()=>({}));
      throw new Error(body.error || ('HTTP ' + res.status));
    }
    return await res.json();
  }catch(err){
    showBanner('Connection problem: ' + err.message + ' — changes may not have saved.', true);
    throw err;
  }
}

async function loadPlants(){
  plants = await api('/plants');
}

async function render(){
  document.getElementById('total-count').textContent = plants.length + ' plants tracked';
  renderFilters();
  renderList();
}

function renderFilters(){
  const rooms = ['all', ...new Set(plants.map(p=>p.room))];
  const el = document.getElementById('filters');
  el.innerHTML = rooms.map(r=>`<button class="chip ${activeFilter===r?'active':''}" data-room="${r}">${r==='all'?'All':r}</button>`).join('');
  el.querySelectorAll('.chip').forEach(btn=>{ btn.onclick = ()=>{ activeFilter = btn.dataset.room; renderList(); renderFilters(); }; });
}

function escapeHtml(str){ const div = document.createElement('div'); div.textContent = str || ''; return div.innerHTML; }

function renderList(){
  const query = document.getElementById('search').value.trim().toLowerCase();
  let filtered = plants.filter(p=>{
    const matchesRoom = activeFilter === 'all' || p.room === activeFilter;
    const matchesQuery = !query || p.name.toLowerCase().includes(query) || (p.notes||'').toLowerCase().includes(query);
    return matchesRoom && matchesQuery;
  });

  const countEl = document.getElementById('search-count');
  countEl.textContent = query ? (filtered.length === 0 ? "No match — you don't have this one yet." : filtered.length + ' match' + (filtered.length===1?'':'es') + ' found.') : '';

  const listEl = document.getElementById('plant-list');
  if(filtered.length === 0){
    listEl.innerHTML = `<div class="empty-state"><div class="icon">🌱</div><div>${query ? 'Nothing matching "'+escapeHtml(query)+'".' : 'No plants in this view.'}</div>${query ? `<button class="btn btn-primary" id="quick-add-btn" style="margin-top:14px;">+ Add "${escapeHtml(query)}"</button>` : ''}</div>`;
    const qb = document.getElementById('quick-add-btn');
    if(qb) qb.onclick = ()=>openModal(query);
    return;
  }

  const roomOrder = [];
  filtered.forEach(p=>{ if(!roomOrder.includes(p.room)) roomOrder.push(p.room); });

  listEl.innerHTML = roomOrder.map(room=>{
    const roomPlants = filtered.filter(p=>p.room===room);
    return `<div class="room-heading"><h2 class="serif">${escapeHtml(room)}</h2><span>${roomPlants.length}</span></div>${roomPlants.map(renderCard).join('')}`;
  }).join('');

  wireCardEvents(listEl);
}

function renderCard(p){
  const isOpen = openCardId === p.id;
  const isLogOpen = openLogFormId === p.id;
  const groupBadge = p.group === 'unsure' ? '' : `<span class="badge ${p.group && p.group.startsWith('group')?p.group:'group-special'}">${groupLabels[p.group]||''}</span>`;
  const statusBadge = p.status !== 'confirmed' ? `<span class="badge status-${p.status}">${p.status}</span>` : '';
  const propBadge = p.propagating ? `<span class="badge propagating">propagating</span>` : '';
  const moveBadge = p.newLocation ? `<div class="move-badge">&#8594; moving to ${escapeHtml(p.newLocation)}</div>` : '';

  const logHtml = (!p.log || p.log.length === 0)
    ? `<div class="empty-log">No soil or fertilizer entries logged yet.</div>`
    : `<div class="log-list">${p.log.map(l=>`<div class="log-entry"><span class="log-date">${l.date}</span><span class="log-type ${l.type}">${l.type}</span><span>${escapeHtml(l.note||'')}</span></div>`).join('')}</div>`;

  const suggestion = zoneSuggestions[p.group] || '';
  const current = p.newLocation || '';
  const options = [];
  if(suggestion) options.push(suggestion);
  knownRooms.forEach(r => { if(r !== suggestion) options.push(r); });
  const isCustom = current && !options.includes(current);
  let optionsHtml = `<option value="">— pick a spot —</option>`;
  options.forEach(opt=>{
    const label = opt === suggestion ? ('Suggested: ' + opt) : opt;
    optionsHtml += `<option value="${escapeHtml(opt)}" ${current===opt?'selected':''}>${escapeHtml(label)}</option>`;
  });
  optionsHtml += `<option value="__custom__" ${isCustom?'selected':''}>Custom / type my own...</option>`;

  return `
    <div class="plant-card ${isOpen?'open':''}">
      <div class="plant-head" data-id="${p.id}">
        <div class="plant-head-main">
          ${p.photoUrl ? `<img class="thumb" src="${p.photoUrl}" alt="">` : ''}
          <div>
            <div class="plant-name">${escapeHtml(p.name)}</div>
            <div class="badge-row">${groupBadge}${statusBadge}${propBadge}</div>
            ${moveBadge}
          </div>
        </div>
        <div class="chevron">&#9656;</div>
      </div>
      <div class="plant-body">
        ${p.photoUrl ? `<img class="plant-photo" src="${p.photoUrl}?t=${Date.now()}" alt="${escapeHtml(p.name)}">` : ''}
        <div class="photo-upload-row">
          <label class="photo-upload-label">${p.photoUrl ? 'Replace photo' : '+ Add photo'}<input type="file" accept="image/*" class="photo-input" data-id="${p.id}"></label>
          ${p.photoUrl ? `<button class="photo-remove" data-id="${p.id}">Remove</button>` : ''}
        </div>
        ${p.notes ? `<div class="notes">${escapeHtml(p.notes)}</div>` : ''}
        <div class="location-field">
          <label>Planned new spot (once regrouped)</label>
          <select class="loc-select" data-id="${p.id}">${optionsHtml}</select>
          <input type="text" class="loc-input" data-id="${p.id}" value="${escapeHtml(current)}" placeholder="Type a custom spot" style="margin-top:6px; ${isCustom ? '' : 'display:none;'}">
          ${p.newLocation ? `<button class="btn btn-secondary confirm-move" data-id="${p.id}" style="margin-top:6px;width:100%;">&#10003; Confirm — it's now in "${escapeHtml(p.newLocation)}"</button>` : ''}
        </div>
        ${logHtml}
        <button class="btn btn-log" data-id="${p.id}">${isLogOpen ? 'Cancel' : '+ Log soil / fertilizer / repot'}</button>
        <div class="log-form ${isLogOpen?'open':''}">
          <select id="log-type-${p.id}"><option>Soil</option><option>Fertilizer</option><option>Repot</option><option>Other</option></select>
          <textarea id="log-note-${p.id}" placeholder="Optional note"></textarea>
          <button class="btn btn-primary save-log" data-id="${p.id}">Save entry</button>
        </div>
        <button class="btn-delete btn-delete-plant" data-id="${p.id}">Remove plant</button>
      </div>
    </div>`;
}

function wireCardEvents(listEl){
  listEl.querySelectorAll('.plant-head').forEach(head=>{
    head.onclick = ()=>{ const id = head.dataset.id; openCardId = openCardId === id ? null : id; renderList(); };
  });
  listEl.querySelectorAll('.btn-log').forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); const id = btn.dataset.id; openLogFormId = openLogFormId === id ? null : id; renderList(); };
  });
  listEl.querySelectorAll('.save-log').forEach(btn=>{
    btn.onclick = async (e)=>{
      e.stopPropagation();
      const id = btn.dataset.id;
      const type = document.getElementById('log-type-'+id).value;
      const note = document.getElementById('log-note-'+id).value.trim();
      await api(`/plants/${id}/logs`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({type, note})});
      await loadPlants();
      openLogFormId = null;
      renderList();
    };
  });
  listEl.querySelectorAll('.btn-delete-plant').forEach(btn=>{
    btn.onclick = async (e)=>{
      e.stopPropagation();
      const id = btn.dataset.id;
      if(confirm('Remove this plant from the ledger?')){
        await api(`/plants/${id}`, {method:'DELETE'});
        await loadPlants();
        renderList();
      }
    };
  });
  listEl.querySelectorAll('.photo-input').forEach(input=>{
    input.onclick = (e)=>e.stopPropagation();
    input.onchange = async (e)=>{
      const id = input.dataset.id;
      const file = input.files[0];
      if(!file) return;
      const fd = new FormData();
      fd.append('photo', file);
      try{
        await api(`/plants/${id}/photo`, {method:'POST', body: fd});
        await loadPlants();
        openCardId = id;
        renderList();
        showBanner('Photo saved.');
      }catch(err){}
    };
  });
  listEl.querySelectorAll('.photo-remove').forEach(btn=>{
    btn.onclick = async (e)=>{
      e.stopPropagation();
      const id = btn.dataset.id;
      await api(`/plants/${id}/photo`, {method:'DELETE'});
      await loadPlants();
      openCardId = id;
      renderList();
    };
  });
  listEl.querySelectorAll('.loc-select').forEach(select=>{
    select.onclick = (e)=>e.stopPropagation();
    select.onchange = async ()=>{
      const id = select.dataset.id;
      if(select.value === '__custom__'){
        openCardId = id; renderList();
        const input = listEl.querySelector(`.loc-input[data-id="${id}"]`);
        if(input){ input.style.display='block'; input.focus(); }
        return;
      }
      await api(`/plants/${id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({newLocation: select.value})});
      await loadPlants();
      openCardId = id;
      renderList();
    };
  });
  listEl.querySelectorAll('.loc-input').forEach(input=>{
    input.onclick = (e)=>e.stopPropagation();
    input.onchange = async ()=>{
      const id = input.dataset.id;
      await api(`/plants/${id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({newLocation: input.value.trim()})});
      await loadPlants();
      openCardId = id;
      renderList();
    };
  });
  listEl.querySelectorAll('.confirm-move').forEach(btn=>{
    btn.onclick = async (e)=>{
      e.stopPropagation();
      const id = btn.dataset.id;
      const plant = plants.find(p=>p.id===id);
      await api(`/plants/${id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({room: plant.newLocation, newLocation: ''})});
      await api(`/plants/${id}/logs`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({type:'Other', note:`Moved to ${plant.newLocation}`})});
      await loadPlants();
      openCardId = id;
      renderList();
    };
  });
}

document.getElementById('search').addEventListener('input', renderList);

const overlay = document.getElementById('modal-overlay');
function openModal(prefillName){
  document.getElementById('new-name').value = prefillName || '';
  document.getElementById('new-room').value = 'Plant Room';
  document.getElementById('new-group').value = 'unsure';
  document.getElementById('new-status').value = 'confirmed';
  document.getElementById('new-notes').value = '';
  document.getElementById('new-propagating').checked = false;
  overlay.classList.add('open');
}
function closeModal(){ overlay.classList.remove('open'); }
document.getElementById('add-fab').onclick = ()=>openModal('');
document.getElementById('close-modal').onclick = closeModal;
document.getElementById('cancel-add').onclick = closeModal;
overlay.onclick = (e)=>{ if(e.target === overlay) closeModal(); };

document.getElementById('save-new').onclick = async ()=>{
  const name = document.getElementById('new-name').value.trim();
  if(!name){ alert('Give it a name first.'); return; }
  await api('/plants', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
    name,
    room: document.getElementById('new-room').value,
    group: document.getElementById('new-group').value,
    status: document.getElementById('new-status').value,
    notes: document.getElementById('new-notes').value.trim(),
    propagating: document.getElementById('new-propagating').checked
  })});
  await loadPlants();
  closeModal();
  activeFilter = 'all';
  document.getElementById('search').value = '';
  render();
};

(async function init(){
  try{
    await loadPlants();
    render();
  }catch(err){
    document.getElementById('plant-list').innerHTML = '<div class="empty-state">Could not reach the server. Check the container is running.</div>';
  }
})();
</script>
</body>
</html>
