<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plant Ledger</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFF4FC; --card:#FFFFFF; --ink:#16233B; --ink-soft:#5B6B85; --ink-muted:#8A9AB5;
    --accent:#2563EB; --accent-light:#60A5FA; --accent-bg:#E6F0FF; --accent-bg-soft:#F0F5FE;
    --line:#EEF3FC; --field-border:#DCE6F5; --danger:#C0392B;
    --status-bg:#FEF3D6; --status-fg:#B4790C;
    --prop-bg:#E0F2FE; --prop-fg:#0369A1;
    --group1-bg:#E6F0FF; --group1-fg:#2563EB;
    --group2-bg:#E3F5EC; --group2-fg:#1C7A4E;
    --group3-bg:#F5E6DC; --group3-fg:#9C5B33;
    --group-special-bg:#EFE3FB; --group-special-fg:#6B3FA0;
    --gradient:linear-gradient(135deg,#2563EB,#60A5FA);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;}
  h1,h2,h3,.heading{font-family:'Manrope',sans-serif;}
  ::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-thumb{background:rgba(37,99,235,0.2);border-radius:3px;}
  .app-shell{max-width:720px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:100px;position:relative;}
  header{background:var(--gradient);color:#fff;padding:28px 24px 24px;border-radius:0 0 28px 28px;}
  header h1{margin:0;font-size:24px;font-weight:800;}
  header p{margin:5px 0 0;color:#DCE9FE;font-size:13px;font-weight:500;}
  .self-hosted-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.16);border-radius:999px;padding:6px 12px 6px 8px;margin-top:10px;}
  .self-hosted-badge span{font-size:10.5px;font-weight:700;color:#fff;white-space:nowrap;}
  .search-bar{padding:18px 24px 8px;margin-top:-18px;}
  #search{width:100%;box-sizing:border-box;border:none;border-radius:14px;padding:13px 16px;font-size:14px;color:var(--ink);background:var(--card);box-shadow:0 8px 20px rgba(37,99,235,0.14);font-family:'Inter',sans-serif;}
  #search:focus{outline:2px solid var(--accent-light);outline-offset:1px;}
  .search-count{font-size:12px;color:var(--ink-soft);padding:8px 24px 0;}
  .filters{display:flex;gap:8px;overflow-x:auto;padding:10px 24px 12px;-webkit-overflow-scrolling:touch;}
  .chip{flex:0 0 auto;padding:7px 15px;border-radius:999px;border:none;background:var(--card);color:var(--accent);font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 2px 8px rgba(37,99,235,0.1);}
  .chip.active{background:var(--accent);color:#fff;box-shadow:none;}
  .util-bar{display:flex;gap:10px;padding:0 24px 4px;}
  .util-btn{flex:1;text-align:center;font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-bg-soft);padding:10px;border-radius:10px;border:none;cursor:pointer;text-decoration:none;}
  main{padding:0 24px;}
  .room-heading{display:flex;align-items:baseline;gap:8px;margin:20px 0 10px;}
  .room-heading h2{margin:0;font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;}
  .room-heading span{font-size:11px;color:var(--ink-muted);}
  .plant-card{background:var(--card);border-radius:16px;margin-bottom:10px;overflow:hidden;box-shadow:0 6px 18px rgba(37,99,235,0.08);}
  .plant-head{padding:13px 14px;display:flex;align-items:center;gap:11px;cursor:pointer;}
  .thumb, .thumb-placeholder{width:44px;height:44px;border-radius:11px;object-fit:cover;flex-shrink:0;}
  .thumb-placeholder{background:var(--accent-bg);display:flex;align-items:center;justify-content:center;color:var(--accent);}
  .plant-head-info{flex:1;min-width:0;}
  .plant-name{font-weight:700;font-size:14px;line-height:1.3;color:var(--ink);}
  .badge-row{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap;}
  .badge{font-size:10px;padding:3px 9px;border-radius:999px;font-weight:700;white-space:nowrap;}
  .badge.group-1{background:var(--group1-bg);color:var(--group1-fg);}
  .badge.group-2{background:var(--group2-bg);color:var(--group2-fg);}
  .badge.group-3{background:var(--group3-bg);color:var(--group3-fg);}
  .badge.group-special{background:var(--group-special-bg);color:var(--group-special-fg);}
  .badge.status-tentative, .badge.status-unconfirmed{background:var(--status-bg);color:var(--status-fg);}
  .badge.propagating{background:var(--prop-bg);color:var(--prop-fg);}
  .move-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--prop-fg);background:var(--prop-bg);padding:3px 9px;border-radius:999px;font-weight:700;margin-top:5px;}
  .chevron{color:var(--ink-muted);font-size:13px;transition:transform 0.15s ease;flex-shrink:0;}
  .plant-card.open .chevron{transform:rotate(90deg);}
  .plant-body{display:none;padding:0 14px 16px;border-top:1px solid var(--line);}
  .plant-card.open .plant-body{display:block;}
  .plant-photo-placeholder{width:100%;height:180px;object-fit:cover;border-radius:14px;margin-top:12px;display:flex;background:var(--accent-bg);align-items:center;justify-content:center;color:var(--accent);}
  .photo-gallery{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:2px;-webkit-overflow-scrolling:touch;}
  .gallery-photo-wrap{position:relative;flex:0 0 auto;}
  .gallery-photo{width:140px;height:140px;object-fit:cover;border-radius:14px;display:block;}
  .gallery-remove{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:999px;background:rgba(22,35,59,0.6);color:#fff;border:none;font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .photo-upload-row{margin-top:10px;display:flex;align-items:center;gap:8px;}
  .photo-upload-label{font-size:12.5px;color:var(--accent);font-weight:700;cursor:pointer;background:var(--accent-bg-soft);padding:8px 12px;border-radius:8px;display:inline-block;position:relative;}
  .photo-upload-label input[type="file"]{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  .notes{font-size:13px;color:var(--ink-soft);margin:10px 0;line-height:1.5;}
  .location-field{margin:10px 0;}
  .location-field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
  .location-field input, .location-field select{width:100%;padding:9px 10px;border:1px solid var(--field-border);border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;background:#fff;color:var(--ink);}
  .log-list{margin:10px 0;}
  .log-entry{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px;}
  .log-entry:last-child{border-bottom:none;}
  .log-date{color:var(--ink-muted);white-space:nowrap;flex-shrink:0;}
  .log-type{font-weight:700;flex-shrink:0;color:var(--accent);}
  .empty-log{font-size:12.5px;color:var(--ink-muted);font-style:italic;}
  .btn{font-family:'Inter',sans-serif;font-weight:700;border:none;border-radius:10px;padding:10px 14px;font-size:13px;cursor:pointer;}
  .btn-log{background:var(--accent-bg-soft);color:var(--accent);width:100%;margin-top:10px;}
  .btn-primary{background:var(--gradient);color:#fff;}
  .btn-secondary{background:var(--accent-bg-soft);color:var(--accent);}
  .btn-delete{background:none;color:var(--danger);font-size:12px;padding:4px 0;text-decoration:underline;margin-top:8px;}
  .log-form{display:none;gap:8px;margin-top:10px;padding:12px;background:#F5F8FE;border-radius:12px;flex-direction:column;}
  .log-form.open{display:flex;}
  .log-form select, .log-form textarea{font-family:'Inter',sans-serif;padding:9px 10px;border:1px solid var(--field-border);border-radius:8px;font-size:13px;background:#fff;}
  .empty-state{text-align:center;padding:48px 20px;color:var(--ink-soft);}
  .empty-state .icon{font-size:2rem;margin-bottom:8px;}
  .fab{position:absolute;bottom:22px;right:22px;background:var(--gradient);color:#fff;border:none;border-radius:999px;padding:14px 22px;font-family:'Inter',sans-serif;font-weight:700;font-size:13px;box-shadow:0 10px 24px rgba(37,99,235,0.4);cursor:pointer;z-index:30;}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(22,35,59,0.5);z-index:50;align-items:flex-end;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px 20px 28px;max-height:88vh;overflow-y:auto;position:relative;}
  .modal h3{margin:0 0 16px;font-size:19px;font-weight:800;color:var(--ink);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%;padding:11px;border:1px solid var(--field-border);border-radius:10px;font-family:'Inter',sans-serif;font-size:14px;}
  .field textarea{resize:vertical;min-height:60px;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions .btn{flex:1;padding:12px;}
  .close-x{position:absolute;top:16px;right:20px;background:none;border:none;font-size:20px;color:var(--ink-muted);cursor:pointer;}
  .status-banner{padding:10px 18px;font-size:0.8rem;text-align:center;}
  .status-banner.error{background:#FBE1DD;color:var(--danger);}
</style>
</head>
<body>

<div class="app-shell">

<header>
  <h1>Toni's Plant Ledger</h1>
  <p id="total-count">Loading...</p>
  <div class="self-hosted-badge">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="4.5" rx="1.5" fill="white"/><rect x="3" y="10" width="18" height="4.5" rx="1.5" fill="white" opacity="0.75"/><rect x="3" y="16" width="18" height="4.5" rx="1.5" fill="white" opacity="0.5"/></svg>
    <span>Self-hosted · Docker</span>
  </div>
</header>

<div id="status-banner"></div>

<div class="search-bar">
  <input type="text" id="search" placeholder="Search a plant name — check before you buy…">
</div>
<div class="search-count" id="search-count"></div>

<div class="filters" id="filters"></div>

<div class="util-bar">
  <a class="util-btn" href="/api/export" download>&#8595; Export JSON snapshot</a>
</div>

<main id="plant-list"></main>

<button class="fab" id="add-fab">+ Add Plant</button>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="close-x" id="close-modal">&times;</button>
    <h3>Add a Plant</h3>
    <div class="field"><label>Name</label><input type="text" id="new-name"></div>
    <div class="field">
      <label>Room</label>
      <select id="new-room">
        <option>Office</option><option>Living Room</option><option>Plant Room</option><option>Outside</option><option>Other</option>
      </select>
    </div>
    <div class="field">
      <label>Care group</label>
      <select id="new-group">
        <option value="group-1">Bright indirect + consistent moisture</option>
        <option value="group-2">Bright-medium, dry between</option>
        <option value="group-3">Bright light, dry-between (drought-tolerant)</option>
        <option value="special">Special care (own category)</option>
        <option value="unsure">Not sure yet</option>
      </select>
    </div>
    <div class="field">
      <label>ID status</label>
      <select id="new-status"><option value="confirmed">Confirmed</option><option value="tentative">Tentative</option><option value="unconfirmed">Unconfirmed</option></select>
    </div>
    <div class="field"><label>Notes (optional)</label><textarea id="new-notes"></textarea></div>
    <div class="field"><label><input type="checkbox" id="new-propagating" style="width:auto;margin-right:6px;">Currently propagating (rooting in water)</label></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancel-add">Cancel</button>
      <button class="btn btn-primary" id="save-new">Add Plant</button>
    </div>
  </div>
</div>

</div>

<script>
const API = '/api';
let plants = [];
let activeFilter = 'all';
let openCardId = null;
let openLogFormId = null;

const groupLabels = {'group-1':'Bright + moist','group-2':'Bright-medium, dry','group-3':'Bright, dry-tolerant','special':'Special care','unsure':'Unsorted'};
const zoneSuggestions = {'group-1':'Bright + Moist zone (Group 1 shelf)','group-2':'Bright-Medium, Dry zone (Group 2 shelf)','group-3':'Bright, Dry-Tolerant zone (Group 3 shelf)','special':'Its own dedicated spot — special care','unsure':''};
const knownRooms = ['Office','Living Room','Plant Room','Outside','Other'];

const leafIconSmall = '<svg width="18" height="18" viewBox="0 0 100 100" fill="none"><path d="M58 76 C26 76 14 40 22 10 C58 10 84 36 80 66 C80 72 68 76 58 76 Z" fill="currentColor"/></svg>';
const leafIconLarge = leafIconSmall.replace('width="18" height="18"', 'width="28" height="28"');

function showBanner(msg, isError){
  const el = document.getElementById('status-banner');
  el.className = 'status-banner' + (isError ? ' error' : '');
  el.textContent = msg;
  if(!isError) setTimeout(()=>{ el.textContent=''; el.className='status-banner'; }, 2500);
}

async function api(path, opts){
  try{
    const res = await fetch(API + path, opts);
    if(!res.ok){
      const body = await res.json().catch(()=>({}));
      throw new Error(body.error || ('HTTP ' + res.status));
    }
    return await res.json();
  }catch(err){
    showBanner('Connection problem: ' + err.message + ' — changes may not have saved.', true);
    throw err;
  }
}

async function loadPlants(){
  plants = await api('/plants');
}

async function render(){
  document.getElementById('total-count').textContent = plants.length + ' plants tracked';
  renderFilters();
  renderList();
}

function renderFilters(){
  const rooms = ['all', ...new Set(plants.map(p=>p.room))];
  const el = document.getElementById('filters');
  el.innerHTML = rooms.map(r=>`<button class="chip ${activeFilter===r?'active':''}" data-room="${r}">${r==='all'?'All':r}</button>`).join('');
  el.querySelectorAll('.chip').forEach(btn=>{ btn.onclick = ()=>{ activeFilter = btn.dataset.room; renderList(); renderFilters(); }; });
}

function escapeHtml(str){ const div = document.createElement('div'); div.textContent = str || ''; return div.innerHTML; }

function renderList(){
  const query = document.getElementById('search').value.trim().toLowerCase();
  let filtered = plants.filter(p=>{
    const matchesRoom = activeFilter === 'all' || p.room === activeFilter;
    const matchesQuery = !query || p.name.toLowerCase().includes(query) || (p.notes||'').toLowerCase().includes(query);
    return matchesRoom && matchesQuery;
  });

  const countEl = document.getElementById('search-count');
  countEl.textContent = query ? (filtered.length === 0 ? "No match — you don't have this one yet." : filtered.length + ' match' + (filtered.length===1?'':'es') + ' found.') : '';

  const listEl = document.getElementById('plant-list');
  if(filtered.length === 0){
    listEl.innerHTML = `<div class="empty-state"><div class="icon">🌱</div><div>${query ? 'Nothing matching "'+escapeHtml(query)+'".' : 'No plants in this view.'}</div>${query ? `<button class="btn btn-primary" id="quick-add-btn" style="margin-top:14px;border-radius:999px;">+ Add "${escapeHtml(query)}"</button>` : ''}</div>`;
    const qb = document.getElementById('quick-add-btn');
    if(qb) qb.onclick = ()=>openModal(query);
    return;
  }

  const roomOrder = [];
  filtered.forEach(p=>{ if(!roomOrder.includes(p.room)) roomOrder.push(p.room); });

  listEl.innerHTML = roomOrder.map(room=>{
    const roomPlants = filtered.filter(p=>p.room===room);
    return `<div class="room-heading"><h2>${escapeHtml(room)}</h2><span>${roomPlants.length}</span></div>${roomPlants.map(renderCard).join('')}`;
  }).join('');

  wireCardEvents(listEl);
}

function renderCard(p){
  const isOpen = openCardId === p.id;
  const isLogOpen = openLogFormId === p.id;
  const groupBadge = p.group === 'unsure' ? '' : `<span class="badge ${p.group && p.group.startsWith('group')?p.group:'group-special'}">${groupLabels[p.group]||''}</span>`;
  const statusBadge = p.status !== 'confirmed' ? `<span class="badge status-${p.status}">${p.status}</span>` : '';
  const propBadge = p.propagating ? `<span class="badge propagating">propagating</span>` : '';
  const moveBadge = p.newLocation ? `<div class="move-badge">&#8594; moving to ${escapeHtml(p.newLocation)}</div>` : '';

  const logHtml = (!p.log || p.log.length === 0)
    ? `<div class="empty-log">No soil or fertilizer entries logged yet.</div>`
    : `<div class="log-list">${p.log.map(l=>`<div class="log-entry"><span class="log-date">${l.date}</span><span class="log-type">${l.type}</span><span>${escapeHtml(l.note||'')}</span></div>`).join('')}</div>`;

  const suggestion = zoneSuggestions[p.group] || '';
  const current = p.newLocation || '';
  const options = [];
  if(suggestion) options.push(suggestion);
  knownRooms.forEach(r => { if(r !== suggestion) options.push(r); });
  const isCustom = current && !options.includes(current);
  let optionsHtml = `<option value="">— pick a spot —</option>`;
  options.forEach(opt=>{
    const label = opt === suggestion ? ('Suggested: ' + opt) : opt;
    optionsHtml += `<option value="${escapeHtml(opt)}" ${current===opt?'selected':''}>${escapeHtml(label)}</option>`;
  });
  optionsHtml += `<option value="__custom__" ${isCustom?'selected':''}>Custom / type my own...</option>`;

  return `
    <div class="plant-card ${isOpen?'open':''}">
      <div class="plant-head" data-id="${p.id}">
        ${p.photos && p.photos[0] ? `<img class="thumb" src="${p.photos[0].url}" alt="">` : `<div class="thumb-placeholder">${leafIconSmall}</div>`}
        <div class="plant-head-info">
          <div class="plant-name">${escapeHtml(p.name)}</div>
          <div class="badge-row">${groupBadge}${statusBadge}${propBadge}</div>
          ${moveBadge}
        </div>
        <div class="chevron">&#8250;</div>
      </div>
      <div class="plant-body">
        ${p.photos && p.photos.length ? `<div class="photo-gallery">${p.photos.map(ph=>`
          <div class="gallery-photo-wrap">
            <img class="gallery-photo" src="${ph.url}?t=${Date.now()}" alt="${escapeHtml(p.name)}">
            <button class="gallery-remove" data-id="${p.id}" data-photo-id="${ph.id}" aria-label="Remove photo">&times;</button>
          </div>`).join('')}</div>` : `<div class="plant-photo-placeholder">${leafIconLarge}</div>`}
        <div class="photo-upload-row">
          <label class="photo-upload-label">+ Add photo${p.photos && p.photos.length ? '(s)' : ''}<input type="file" accept="image/*" multiple class="photo-input" data-id="${p.id}"></label>
        </div>
        ${p.notes ? `<div class="notes">${escapeHtml(p.notes)}</div>` : ''}
        <div class="location-field">
          <label>Planned new spot (once regrouped)</label>
          <select class="loc-select" data-id="${p.id}">${optionsHtml}</select>
          <input type="text" class="loc-input" data-id="${p.id}" value="${escapeHtml(current)}" placeholder="Type a custom spot" style="margin-top:6px; ${isCustom ? '' : 'display:none;'}">
          ${p.newLocation ? `<button class="btn btn-secondary confirm-move" data-id="${p.id}" style="margin-top:6px;width:100%;">&#10003; Confirm — it's now in "${escapeHtml(p.newLocation)}"</button>` : ''}
        </div>
        ${logHtml}
        ${isLogOpen ? '' : `<button class="btn btn-log" data-id="${p.id}">+ Log soil / fertilizer / repot</button>`}
        <div class="log-form ${isLogOpen?'open':''}">
          <select id="log-type-${p.id}"><option>Soil</option><option>Fertilizer</option><option>Repot</option><option>Other</option></select>
          <textarea id="log-note-${p.id}" placeholder="Optional note"></textarea>
          <button class="btn btn-primary save-log" data-id="${p.id}">Save entry</button>
        </div>
        ${isLogOpen ? `<button class="btn btn-log cancel-log" data-id="${p.id}" style="background:none;color:var(--ink-soft);">Cancel</button>` : ''}
        <button class="btn-delete btn-delete-plant" data-id="${p.id}">Remove plant</button>
      </div>
    </div>`;
}

function wireCardEvents(listEl){
  listEl.querySelectorAll('.plant-head').forEach(head=>{
    head.onclick = ()=>{ const id = head.dataset.id; openCardId = openCardId === id ? null : id; renderList(); };
  });
  listEl.querySelectorAll('.btn-log, .cancel-log').forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); const id = btn.dataset.id; openLogFormId = openLogFormId === id ? null : id; renderList(); };
  });
  listEl.querySelectorAll('.save-log').forEach(btn=>{
    btn.onclick = async (e)=>{
      e.stopPropagation();
      const id = btn.dataset.id;
      const type = document.getElementById('log-type-'+id).value;
      const note = document.getElementById('log-note-'+id).value.trim();
      await api(`/plants/${id}/logs`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({type, note})});
      await loadPlants();
      openLogFormId = null;
      renderList();
    };
  });
  listEl.querySelectorAll('.btn-delete-plant').forEach(btn=>{
    btn.onclick = async (e)=>{
      e.stopPropagation();
      const id = btn.dataset.id;
      if(confirm('Remove this plant from the ledger?')){
        await api(`/plants/${id}`, {method:'DELETE'});
        await loadPlants();
        renderList();
      }
    };
  });
  listEl.querySelectorAll('.photo-input').forEach(input=>{
    input.onclick = (e)=>e.stopPropagation();
    input.onchange = async (e)=>{
      const id = input.dataset.id;
      const files = Array.from(input.files || []);
      if(!files.length) return;
      try{
        for(const file of files){
          const fd = new FormData();
          fd.append('photo', file);
          await api(`/plants/${id}/photos`, {method:'POST', body: fd});
        }
        await loadPlants();
        openCardId = id;
        renderList();
        showBanner(files.length > 1 ? `${files.length} photos saved.` : 'Photo saved.');
      }catch(err){}
    };
  });
  listEl.querySelectorAll('.gallery-remove').forEach(btn=>{
    btn.onclick = async (e)=>{
      e.stopPropagation();
      const id = btn.dataset.id;
      const photoId = btn.dataset.photoId;
      await api(`/plants/${id}/photos/${photoId}`, {method:'DELETE'});
      await loadPlants();
      openCardId = id;
      renderList();
    };
  });
  listEl.querySelectorAll('.loc-select').forEach(select=>{
    select.onclick = (e)=>e.stopPropagation();
    select.onchange = async ()=>{
      const id = select.dataset.id;
      if(select.value === '__custom__'){
        openCardId = id; renderList();
        const input = listEl.querySelector(`.loc-input[data-id="${id}"]`);
        if(input){ input.style.display='block'; input.focus(); }
        return;
      }
      await api(`/plants/${id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({newLocation: select.value})});
      await loadPlants();
      openCardId = id;
      renderList();
    };
  });
  listEl.querySelectorAll('.loc-input').forEach(input=>{
    input.onclick = (e)=>e.stopPropagation();
    input.onchange = async ()=>{
      const id = input.dataset.id;
      await api(`/plants/${id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({newLocation: input.value.trim()})});
      await loadPlants();
      openCardId = id;
      renderList();
    };
  });
  listEl.querySelectorAll('.confirm-move').forEach(btn=>{
    btn.onclick = async (e)=>{
      e.stopPropagation();
      const id = btn.dataset.id;
      const plant = plants.find(p=>p.id===id);
      await api(`/plants/${id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({room: plant.newLocation, newLocation: ''})});
      await api(`/plants/${id}/logs`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({type:'Other', note:`Moved to ${plant.newLocation}`})});
      await loadPlants();
      openCardId = id;
      renderList();
    };
  });
}

document.getElementById('search').addEventListener('input', renderList);

const overlay = document.getElementById('modal-overlay');
function openModal(prefillName){
  document.getElementById('new-name').value = prefillName || '';
  document.getElementById('new-room').value = 'Plant Room';
  document.getElementById('new-group').value = 'unsure';
  document.getElementById('new-status').value = 'confirmed';
  document.getElementById('new-notes').value = '';
  document.getElementById('new-propagating').checked = false;
  overlay.classList.add('open');
}
function closeModal(){ overlay.classList.remove('open'); }
document.getElementById('add-fab').onclick = ()=>openModal('');
document.getElementById('close-modal').onclick = closeModal;
document.getElementById('cancel-add').onclick = closeModal;
overlay.onclick = (e)=>{ if(e.target === overlay) closeModal(); };

document.getElementById('save-new').onclick = async ()=>{
  const name = document.getElementById('new-name').value.trim();
  if(!name){ alert('Give it a name first.'); return; }
  await api('/plants', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
    name,
    room: document.getElementById('new-room').value,
    group: document.getElementById('new-group').value,
    status: document.getElementById('new-status').value,
    notes: document.getElementById('new-notes').value.trim(),
    propagating: document.getElementById('new-propagating').checked
  })});
  await loadPlants();
  closeModal();
  activeFilter = 'all';
  document.getElementById('search').value = '';
  render();
};

(async function init(){
  try{
    await loadPlants();
    render();
  }catch(err){
    document.getElementById('plant-list').innerHTML = '<div class="empty-state">Could not reach the server. Check the container is running.</div>';
  }
})();
</script>
</body>
</html>
